<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>局域网聊天室</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: min(760px, 100%);
      height: min(720px, 100%);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .12);
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #eef2f7;
    }

    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: .3px;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748b;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .15);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .row { display: flex; }
    .row.mine { justify-content: flex-end; }

    .bubble {
      max-width: 76%;
      padding: 9px 13px;
      border-radius: 14px;
      background: #f1f5f9;
      color: #0f172a;
    }

    .mine .bubble {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .row:not(.mine) .bubble { border-bottom-left-radius: 4px; }

    .meta {
      font-size: 11px;
      opacity: .65;
      margin-bottom: 3px;
    }

    .text {
      font-size: 14.5px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .system {
      align-self: center;
      font-size: 12px;
      color: #94a3b8;
      background: #f8fafc;
      padding: 4px 12px;
      border-radius: 999px;
    }

    form.composer {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #eef2f7;
      background: #fff;
    }

    .composer input {
      flex: 1;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14.5px;
      outline: none;
      transition: border-color .15s, background .15s;
    }

    .composer input:focus {
      border-color: #93c5fd;
      background: #fff;
    }

    .composer button {
      border: 0;
      border-radius: 12px;
      padding: 0 22px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      cursor: pointer;
      transition: background .15s;
    }

    .composer button:hover:not(:disabled) { background: #1d4ed8; }
    .composer button:disabled { background: #cbd5e1; cursor: not-allowed; }

    .join-layer {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      backdrop-filter: blur(3px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .join-layer.hidden { display: none; }

    .join-card {
      width: min(360px, 100%);
      background: #fff;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .25);
    }

    .join-card h2 {
      margin: 0 0 6px;
      font-size: 19px;
      color: #0f172a;
    }

    .join-card p {
      margin: 0 0 18px;
      font-size: 13px;
      color: #64748b;
    }

    .join-card input {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14.5px;
      outline: none;
      margin-bottom: 12px;
    }

    .join-card input:focus { border-color: #93c5fd; }

    .join-card button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-size: 14.5px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      cursor: pointer;
    }

    .join-card button:hover { background: #1d4ed8; }

    @media (max-width: 560px) {
      body { padding: 0; }
      .app { height: 100vh; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>局域网聊天室</h1>
      <span class="online"><span class="dot"></span><span id="online-count">0</span> 人在线</span>
    </header>

    <section id="messages" aria-live="polite"></section>

    <form id="composer" class="composer">
      <input id="input" autocomplete="off" placeholder="说点什么…" disabled />
      <button type="submit" disabled>发送</button>
    </form>
  </main>

  <div id="join-layer" class="join-layer">
    <form id="join-form" class="join-card">
      <h2>加入聊天室</h2>
      <p>取个昵称，同一局域网的人都能看到你</p>
      <input id="name-input" maxlength="20" placeholder="你的昵称" autocomplete="off" autofocus />
      <button type="submit">进入</button>
    </form>
  </div>

  <script>
    const els = {
      messages: document.getElementById("messages"),
      composer: document.getElementById("composer"),
      input: document.getElementById("input"),
      sendBtn: document.querySelector("#composer button"),
      online: document.getElementById("online-count"),
      joinLayer: document.getElementById("join-layer"),
      joinForm: document.getElementById("join-form"),
      nameInput: document.getElementById("name-input"),
    };

    let socket = null;
    let myName = "";
    let closing = false;

    function scrollToBottom() {
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function addMessage({ name, text, time }) {
      const mine = name === myName;
      const row = document.createElement("div");
      row.className = mine ? "row mine" : "row";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${name} · ${time}`;

      const body = document.createElement("div");
      body.className = "text";
      body.textContent = text; // 用 textContent 而不是 innerHTML，避免别人发 HTML 被执行

      bubble.append(meta, body);
      row.append(bubble);
      els.messages.append(row);
      scrollToBottom();
    }

    function addSystem(text) {
      const line = document.createElement("div");
      line.className = "system";
      line.textContent = text;
      els.messages.append(line);
      scrollToBottom();
    }

    function connect() {
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      socket = new WebSocket(`${scheme}://${location.host}/ws`);

      socket.addEventListener("open", () => {
        socket.send(JSON.stringify({ type: "join", name: myName }));
      });

      socket.addEventListener("message", (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "history") {
          els.messages.innerHTML = "";
          data.messages.forEach(addMessage);
        } else if (data.type === "message") {
          addMessage(data);
        } else if (data.type === "system") {
          addSystem(data.text);
        } else if (data.type === "online") {
          els.online.textContent = data.count;
        }
      });

      socket.addEventListener("close", () => {
        if (closing) return;
        els.online.textContent = "0";
        addSystem("连接断开了，正在重连…");
        setTimeout(connect, 1500);
      });
    }

    els.joinForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = els.nameInput.value.trim();
      if (!name) return;

      myName = name;
      els.joinLayer.classList.add("hidden");
      els.input.disabled = false;
      els.sendBtn.disabled = false;
      els.input.focus();
      connect();
    });

    els.composer.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = els.input.value.trim();
      if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

      socket.send(JSON.stringify({ type: "message", text }));
      els.input.value = "";
      els.input.focus();
    });

    // 回车发送；输入法选词时的回车（isComposing）不当作发送
    els.input.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.isComposing) return;
      event.preventDefault();
      els.composer.requestSubmit();
    });
  </script>
</body>
</html>
